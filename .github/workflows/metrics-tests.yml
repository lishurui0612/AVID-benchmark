name: Metrics tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metrics-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metrics:
    name: Core metrics (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.1.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]"
      - name: Run core metric and evaluation CLI tests
        run: python -m pytest tests/test_metrics.py tests/test_evaluation_cli.py -q -ra
