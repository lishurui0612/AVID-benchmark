[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avid-benchmark"
version = "0.1.0"
description = "Independent AVID benchmark metrics and four reproducible fMRI baselines"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24,<2", "Pillow>=9", "PyYAML>=6", "scipy>=1.10", "scikit-image>=0.20"]

[project.optional-dependencies]
evaluation = ["torch>=2.1", "torchvision>=0.16", "transformers>=4.37.2", "sentencepiece"]
tifa = ["torch==2.1.0", "torchvision==0.16.0", "torchaudio==2.1.0", "transformers==4.37.2", "modelscope==1.8.4", "datasets==2.13.0", "pyarrow==12.0.1", "fsspec==2023.6.0", "fairseq @ https://github.com/facebookresearch/fairseq/archive/4a388e64cd646ed7d7ad8de8fae55df2b8eea91d.tar.gz", "omegaconf==2.0.6", "timm==0.9.12", "einops==0.7.0", "decord==0.6.0", "librosa==0.10.2.post1", "soundfile==0.12.1", "opencv-python-headless==4.10.0.84", "rapidfuzz>=3,<4", "zhconv==1.4.3", "unicodedata2>=15,<17", "nltk>=3.8,<4", "sentencepiece", "jieba==0.42.1", "yapf==0.40.1"]
models = ["torch==2.1.0", "torchvision==0.16.0", "transformers==4.37.2", "huggingface_hub==0.25.0", "diffusers==0.23.0", "accelerate==0.24.1", "webdataset==0.2.73", "open_clip_torch==2.24.0", "clip-anytorch", "himalaya==0.4.11", "scikit-learn", "omegaconf", "einops", "tqdm", "kornia==0.7.1", "dalle2-pytorch==1.15.6", "pytorch-lightning==2.0.1", "torchmetrics==1.3.0.post0", "safetensors>=0.4", "fsspec", "h5py", "matplotlib", "pandas", "umap-learn", "wandb"]
test = ["pytest>=7"]

[project.scripts]
avid-train = "avid_benchmark.cli:train_main"
avid-predict = "avid_benchmark.cli:predict_main"
avid-evaluate = "avid_benchmark.cli:evaluate_main"

[tool.setuptools.packages.find]
include = ["avid_benchmark*"]

[tool.setuptools.package-data]
avid_benchmark = ["recipes/*.json", "vendor/**/*.yaml", "vendor/**/*.json", "vendor/**/*.txt", "vendor/**/LICENSE*", "vendor/vmi_metrics/simple_identity_disjoint_v1_*.csv", "vendor/vmi_metrics/simple_identity_disjoint_v1_attribute_comparison.md", "vendor/vmi_metrics/simple_sub01_current_val80_manifest.csv"]
