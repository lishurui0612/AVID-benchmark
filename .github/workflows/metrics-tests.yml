name: Metrics tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metrics-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metrics:
    name: Core metrics (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.1.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]"
      - name: Run core metric and evaluation CLI tests
        run: python -m pytest tests/test_metrics.py tests/test_evaluation_cli.py -q -ra

  tifa-installation:
    name: TIFA installation (CPU)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install TIFA dependencies in a clean environment
        env:
          MAX_JOBS: "1"
        run: |
          python -m pip install "pip==24.0" "setuptools==69.5.1" wheel "Cython==0.29.37" "numpy==1.26.4"
          python -m pip install torch==2.1.0 torchvision==0.16.0 torchaudio==2.1.0 --index-url https://download.pytorch.org/whl/cpu
          env -u CUDA_HOME python -m pip install --no-build-isolation -e ".[tifa,test]"
          python -m pip check
      - name: Check real TIFA inference imports
        run: python tests/tifa_installation_check.py
      - name: Run metric and CLI regressions with TIFA installed
        run: python -m pytest tests/test_metrics.py tests/test_evaluation_cli.py -q -ra
